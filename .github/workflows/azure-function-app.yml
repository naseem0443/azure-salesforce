name: Deploy Azure Function App

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/azure-function-app.yml"

  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: "func-pdfmasterpro-prod"
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "api"
  NODE_VERSION: "22.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    name: Build and Deploy Function App

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build application
        working-directory: api
        run: npm run build

      - name: Verify Azure Functions package
        working-directory: api
        run: |
          echo "Checking host.json..."
          test -f host.json

          echo "Checking package.json..."
          test -f package.json

          echo "Checking compiled Function..."
          test -f dist/lead/index.js

          echo "Package structure:"
          find . -maxdepth 3 -type f \
            ! -path "./node_modules/*" | sort

      - name: Run tests
        working-directory: api
        run: npm test --if-present

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Function App
        run: |
          az functionapp show \
            --resource-group rg-pdfmasterpro-prod \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --query "{name:name,state:state,kind:kind}" \
            -o json

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          sku: flexconsumption
          remote-build: false